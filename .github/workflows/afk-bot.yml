name: AFK Bot
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
concurrency:
  group: afk-bot
  cancel-in-progress: false
jobs:
  bot:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install
        working-directory: bot
        run: npm install --no-audit --no-fund
      - name: Run bot
        working-directory: bot
        env:
          MC_HOST: mythoscraft.mcsh.io
          BOT_NAME: MythosBot
          STAY_MINUTES: "25"
          AUTHME_PASSWORD: ${{ secrets.AUTHME_PASSWORD }}
        run: node bot.js
