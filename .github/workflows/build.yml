name: Build IPA
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Build
        run: |
          xcodebuild -project ServerMonitor.xcodeproj -scheme ServerMonitor \
            -configuration Release -sdk iphoneos -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
      - name: Package IPA
        run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/ServerMonitor.app Payload/
          zip -qry ServerMonitor.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: ServerMonitor-ipa
          path: ServerMonitor.ipa
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Server Monitor (neuester Build)
          make_latest: true
          files: ServerMonitor.ipa
